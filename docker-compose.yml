services:
  db:
    image: postgres:16-alpine
    container_name: satquery-db
    environment:
      POSTGRES_USER: satquery
      POSTGRES_PASSWORD: satquery
      POSTGRES_DB: satquery
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satquery"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: satquery-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://satquery:satquery@db:5432/satquery
      UPLOAD_DIR: /app/uploads
      AI_MODE: mock
      MODEL_PATH: ""
      PYTHONPATH: /app
    ports:
      - "4000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    container_name: satquery-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "2000:80"

volumes:
  pgdata:
