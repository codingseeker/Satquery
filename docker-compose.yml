# ---------------------------------------------------------
# Local development only.
# Production uses: Vercel (frontend) + Render (backend) + managed PostgreSQL.
#
# Persistence model
# -----------------
# - pgdata        : named volume holding the PostgreSQL database files.
#                   Registered users and all application data survive
#                   `docker compose down`/`up` and container recreation.
# - backend_data  : named volume mounted at /app/data so a SQLite fallback
#                   (DATABASE_URL=sqlite:///./data/app.db) is also persistent.
# - ./backend/uploads : host bind mount for uploaded files (user data, not DB).
# No caches, build artifacts, or temp files are treated as persistent state.
# ---------------------------------------------------------

services:
  db:
    image: postgres:16-alpine
    container_name: satquery-db
    environment:
      POSTGRES_USER: satquery
      POSTGRES_PASSWORD: satquery
      POSTGRES_DB: satquery
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satquery"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: satquery-backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # `db` is the compose service name; `localhost` would point at the
      # container itself and could never reach PostgreSQL. Override via the
      # root `.env` file with DATABASE_URL=... if you need a different target.
      DATABASE_URL: ${DATABASE_URL:-postgresql://satquery:satquery@db:5432/satquery}
      UPLOAD_DIR: /app/uploads
      AI_MODE: ${AI_MODE:-mock}
      MODEL_PATH: ${MODEL_PATH:-}
      PYTHONPATH: /app
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    ports:
      - "4000:8000"
    volumes:
      # Persistent application data.
      - backend_data:/app/data
      # User-uploaded files (kept on the host for local development).
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    container_name: satquery-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "2000:80"

volumes:
  pgdata:
    name: satquery_pgdata
  backend_data:
    name: satquery_backend_data